[package]
name = "acowork-memory"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

description = "MemoryProvider trait, shared memory types, the SQLite workspace store (ADR-082), and the standalone memory service (ADR-100)"

[lib]
name = "acowork_memory"
path = "src/lib.rs"

# Standalone memory service process (spawned/supervised by the Gateway,
# ADR-100 — same pattern as acowork-doc / acowork-pm / acowork-user).
[[bin]]
name = "acowork-memory"
path = "src/main.rs"

[dependencies]
acowork-core.workspace = true
async-trait.workspace = true
# bundled → FTS5 + the `trigram` tokenizer are always available (ADR-082 D3).
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
tracing.workspace = true

# Service layer (ADR-100): HTTP server, CLI flags, TOML config file.
axum.workspace = true
reqwest.workspace = true
tokio.workspace = true
clap.workspace = true
toml.workspace = true
# Global-resources pull (ADR-100 decision 7): the Gateway topics are base64
# `DataEnvelope` protobuf bytes over HTTP, identical to the MQTT wire format.
base64.workspace = true
prost.workspace = true

[dev-dependencies]
# Test-only retrieval metric/dataset kernel, shared with acowork-runtime's
# harnesses so both sides score with one definition (see acowork-eval).
acowork-eval = { workspace = true }
tempfile.workspace = true
tokio.workspace = true
expect-test.workspace = true
# Drives the MCP router without binding a socket (`ServiceExt::oneshot`).
tower.workspace = true
