[package]
name = "acowork-lsp-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

description = "LSP protocol relay — standalone process managed by Gateway supervisor"

[[bin]]
name = "acowork-lsp-relay"
path = "src/main.rs"

# Test fixture for the process pool (`tests/pool_process.rs`), not a product
# binary. It exists because the pool tests used to spawn the POSIX `cat`,
# which is absent on Windows — see src/bin/mock_lsp.rs. Same two-bin shape as
# acowork-sign: callers select the binary explicitly (`--bin acowork-lsp-relay`).
[[bin]]
name = "mock_lsp"
path = "src/bin/mock_lsp.rs"

[dependencies]
acowork-core.workspace = true
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
futures-util.workspace = true
async-stream = "0.3"
anyhow.workspace = true
reqwest = { workspace = true, features = ["json"] }
tower-http.workspace = true
indexmap = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
tower = { workspace = true, features = ["util"] }
tokio-tungstenite.workspace = true