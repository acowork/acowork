[workspace]
members = [
    "acowork-core",
    "acowork-mcp",
    "acowork-memory",
    "acowork-mqtt-session",
    "acowork-runtime",
    "acowork-gateway",
    "acowork-node",
    "acowork-sqlite",
    "acowork-vault",
    "acowork-sign",
    "acowork-tool-sdk",
    "acowork-embed",
    "acowork-lsp-relay",
    "acowork-pm",
    "acowork-doc",
    "acowork-user",
    "acowork-relay",
    # Dev-only: the retrieval-evaluation kernel the memory and runtime test
    # harnesses share. It is a `[dev-dependencies]` entry of those two crates
    # and must never be linked into a shipped binary — see
    # `acowork-eval/tests/shipping_redline.rs`.
    "acowork-eval",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"

# Dev profile uses Cargo defaults (`opt-level = 0` + full debuginfo).
# An earlier optimization (PERF-001, `opt-level = 2` in dev) was reverted after
# the runtime CPU issue was confirmed to be unrelated to compilation flags —
# so there is no longer a reason to deviate from the standard dev profile.
[profile.dev]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.50", default-features = false, features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync", "process", "io-std", "fs", "signal"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
# `preserve_order` keeps `serde_json::Map` (and therefore `serde_json::Value::Object`)
# in insertion order rather than sorting alphabetically via `BTreeMap`. The harness
# LSP tab relies on this: with alphabetical order, the same LSP list reorders
# mid-response when round-tripped through `serde_json::Value`.
serde_json = { version = "1.0", features = ["preserve_order"] }
bincode = { version = "2.0", features = ["serde", "derive"] }

# Insertion-order preserving maps (HashMap with deterministic iteration).
# Used by the LSP relay to keep the configured server list in the order
# the operator wrote in `lsp_servers.json` — `HashMap` would randomize it.
indexmap = { version = "2", features = ["serde"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
# `log` facade gate (see acowork-core::logging::sync_log_facade): third-party
# crates that log through `log` (yamux, rumqttc) are silenced unless the
# process raises `log`'s runtime max level.
log = "0.4"
tracing-subscriber = { version = "0.3", features = ["fmt", "ansi", "env-filter"] }
tracing-appender = "0.2"

# Async trait. Floor is 0.1.92, not 0.1: earlier releases inject a bare
# `#[must_use]` into every `#[async_trait]` method, and the boxed future it
# returns is already `must_use`, so clippy 1.99's `double_must_use` fires on
# every annotated trait in the workspace and `cargo clippy -- -D warnings`
# cannot pass. Cargo.lock is not committed, so the floor is what carries the fix.
async-trait = "0.1.92"

# Cryptography
chacha20poly1305 = "0.10"
rand = "0.10"

# Configuration
toml = "1.0"
directories = "6.0"

# Date/time
chrono = { version = "0.4", features = ["clock", "std", "serde"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Database
rusqlite = { version = "0.37", features = ["bundled"] }

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Token counting
tiktoken-rs = "0.12"

# ZIP
zip = { version = "8.1", default-features = true, features = ["deflate-flate2"] }

# Encoding
base64 = "0.22"
hex = "0.4"
urlencoding = "2.1"

# Document parsing
pdf-extract = "0.12"
calamine = "0.26"
quick-xml = "0.37"
lopdf = "0.44"

# Concurrency primitives
parking_lot = "0.12"

# UUID
uuid = { version = "1.22", features = ["v4", "std"] }
# `sink`+`io`: WS sink/stream adapters and copy_bidirectional for the
# relay tunnel data path (design doc 24).
futures-util = { version = "0.3", features = ["sink", "io"] }

# Stream
futures-core = "0.3"
tokio-stream = { version = "0.1", features = ["io-util"] }
# `ReaderStream` / `StreamReader` for streaming `AsyncRead` blobs straight
# into axum's `Body::from_stream` (e.g. user-chat attachment download).
# We only need the `io` feature, which exposes `tokio_util::io::ReaderStream`;
# `io-util` would also work but pulls in `tokio/rt`. `tokio-stream`'s own
# lib.rs explicitly defers these adapters to `tokio-util`.
# `compat` (design doc 24): tokio↔futures IO bridging in the tunnel path.
tokio-util = { version = "0.7", default-features = false, features = ["io", "compat"] }
tokio-tungstenite = "0.29"

# Relay TLS termination (design doc 24 §5.3): SNI-routed entry listener.
# ring provider keeps a single crypto backend alongside tokio-tungstenite.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"

# Regex
regex = "1.0"

# Signing
ed25519-dalek = { version = "2.1", features = ["std"] }
x509-cert = "0.2"
sha2 = "0.10"
serde_yaml = "0.9"

# Secret protection
secrecy = "0.10"

# Testing
tempfile = "3.0"
mockito = "1"
expect-test = "1.5"

# System
libc = "0.2"

# File watching
notify = "8"

# ripgrep-based file traversal (gitignore-aware)
ignore = "0.4"
globset = "0.4"

# Interactive CLI
dialoguer = "0.11"

# WASM runtime
wasmtime = "29"
wasmtime-wasi = "29"

# Protobuf encoding for the MQTT payload wire format (ADR-033).
#
# `prost` is used at runtime (via `prost::Message::encode_to_vec` / `decode`) for
# every PUBLISH payload exchanged over the local MQTT bus. `prost-build` is a
# build-time dependency that compiles `mqtt_payload.proto` from `OUT_DIR`; it
# runs from `core/acowork-core/build.rs`.
#
# `protoc-bin-vendored` is the protoc binary we ship on each platform, so
# contributors and CI don't need a system-installed protoc.
#
# Note: the previous `tonic` / `tonic-build` entries lived here for the legacy
# gRPC Gateway IPC. That protocol has been fully superseded by MQTT (ADR-033 +
# ADR-034 Phase 6), so `tonic` and `tonic-build` are now removed from this
# workspace.
prost = "0.13"
prost-build = "0.13"
protoc-bin-vendored = "3"

# MQTT (ADR-033)
# `websocket` feature (design doc 24): MQTT-over-WSS transport for the
# relay remote mode (rumqttc `Transport::Wss`).
# `default-features = false` + `use-rustls-no-provider`: rumqttc's default
# `use-rustls` enables tokio-rustls/default → rustls `aws-lc-rs`, which
# collides with the workspace-wide `ring` provider (feature unification
# would leave `ClientConfig::builder()` unable to auto-select a
# CryptoProvider — runtime panic). TLS still works: the ring provider is
# guaranteed by acowork-mqtt-session (rustls/ring dep + explicit
# `install_default`).
rumqttc = { version = "0.25", default-features = false, features = ["websocket", "use-rustls-no-provider"] }
rumqttd = { version = "0.20", default-features = false }

# Stream multiplexing inside the relay tunnel WSS connection
# (design doc 24 §5.2): one logical yamux stream per client connection.
yamux = "0.14"

# ONNX Runtime — static or dynamic linking.
#
# The `download-binaries` feature downloads and statically links prebuilt ORT.
#   Windows: Requires MSVC v144+ (14.40+).
#   Linux:   Requires glibc 2.38+ (Ubuntu 23.10+, Fedora 39+).
#   macOS:   Requires macOS 12+ (Monterey).
#
# For older Linux (e.g. Ubuntu 22.04, glibc < 2.38), disable `download-binaries`
# and install ONNX Runtime manually:
#   export ORT_LIB_LOCATION=/path/to/onnxruntime/lib
#   export ORT_DYLIB_PATH=/path/to/onnxruntime/lib/libonnxruntime.so
#   cargo build --release -p acowork-embed
#
# GPU acceleration (opt-in per platform):
#   --features directml (Windows) | cuda (Linux) | coreml (macOS)
#
# `api-19` is pinned to the OLDEST ONNX Runtime the project supports (1.19.2,
# the legacy glibc 2.31 / Ubuntu 20.04 build that `dev/setup_ort.sh` installs).
# `GetApi(22)` returns null against a 1.19.2 runtime, and `ort` panics in
# `setup_api` — poisoning its internal `Once`, so every later load attempt
# fails with a misleading "Mutex poisoned". `GetApi` is backward compatible,
# so a newer runtime still serves the API-19 table. Raise this only together
# with the minimum in `ORT_VERSION_LEGACY` (dev/setup_ort.sh).
# ponytail: pinned to rc.14 because the RC.13→RC.14 release introduced a
# breaking change to `Session::builder` (now requires `&Environment`).
# Upgrade path: bump when `ort` reaches a stable 2.0.x release, or when
# we adapt the call site to the next RC's signature.
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "api-19"] }

# Tokenizer (HuggingFace)
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }

# Signal handling (graceful shutdown)
signal-hook = "0.3"

# Numerical arrays (for ONNX tensor construction)
ndarray = "0.17"

# Internal crate references
acowork-core = { path = "acowork-core" }
acowork-mcp = { path = "acowork-mcp" }
acowork-memory = { path = "acowork-memory" }
acowork-sqlite = { path = "acowork-sqlite" }
acowork-runtime = { path = "acowork-runtime" }
acowork-gateway = { path = "acowork-gateway" }
# NOTE (ADR-055 §6.20 dependency red line): `acowork-node` must NEVER
# appear as a dependency of `acowork-gateway`, and `acowork-node` must
# NEVER depend on `acowork-gateway`. Enforced by tests in both crates
# (see `acowork-node` `tests/dependency_redline.rs`) and `dev/ci.sh`.
acowork-node = { path = "acowork-node" }
acowork-vault = { path = "acowork-vault" }
acowork-sign = { path = "acowork-sign" }
acowork-embed = { path = "acowork-embed" }
acowork-lsp-relay = { path = "acowork-lsp-relay" }
acowork-mqtt-session = { path = "acowork-mqtt-session" }
acowork-pm = { path = "acowork-pm" }
acowork-relay = { path = "acowork-relay" }
# Dev-only: see the workspace member note above. Referenced from
# `[dev-dependencies]` only.
acowork-eval = { path = "acowork-eval" }

# The next build will work

