[package]
name = "acowork-pm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

description = "Project & Task management service — directory-tree storage, dependency graph, parent-child task tree, attachments, REST API + MCP tools"

[lib]
name = "acowork_pm"
path = "src/lib.rs"

# ADR-064: standalone process binary (spawned/supervised by the Gateway).
[[bin]]
name = "acowork-pm"
path = "src/main.rs"

[features]
default = []
# Generate thumbnails for image attachments on upload
image-thumb = ["dep:image"]
# Promote dependencies to blocking before claim (default: soft warn only)
strict-deps = []

[dependencies]
acowork-core.workspace = true

# Async runtime
tokio.workspace = true
async-trait.workspace = true
futures-util.workspace = true
tokio-stream.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }

# HTTP server
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
reqwest.workspace = true

# Date/time + UUID
chrono.workspace = true
uuid.workspace = true

# Concurrency
parking_lot.workspace = true

# ADR-117 D6: SQLite backend + one-shot JSON importer.
# Reuses the workspace-wide bundled SQLite so no system library is needed.
rusqlite.workspace = true

# File watching + traversal
notify.workspace = true
ignore.workspace = true
regex.workspace = true

# Configuration
toml.workspace = true

# CLI (standalone process entry, ADR-064)
clap.workspace = true

# MIME type detection (attachment uploads)
mime_guess = "2"

# Integrity checksum for attachment uploads (sha256)
sha2.workspace = true
hex.workspace = true

# Image thumbnail generation (feature-gated)
image = { version = "0.25", optional = true }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
# `doc_refs_route_e2e`: the doc_refs validation regression runs against the
# REAL doc service (its own router, its own route table) instead of a stub
# that mocked the same wrong path the implementation used — the mock and
# the code agreeing with each other is what let the 404 ship green.
# Dev-only: PM never links the doc service in production.
acowork-doc = { workspace = true }
async-trait.workspace = true
reqwest.workspace = true
axum.workspace = true
serde_json.workspace = true
