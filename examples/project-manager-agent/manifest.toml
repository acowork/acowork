# Project Manager Agent
# A professional project manager for requirements, planning, tracking, risk, and communication.

agent_id = "com.acowork.project-manager"
version = "1.0.0"
name = "PM"
display_name = "PM"
role = "Project Manager"
description = "A professional project manager skilled in requirements analysis, task decomposition, progress tracking, risk assessment, and team coordination."
author = "ACowork Team"
runtime_version = "0.1.0"
dev = false
labels = ["project-management", "planning"]
avatar = "assets/avatar.jpg"

identity_deps = ["display_name", "language", "timezone"]

[[permissions]]
type = "FilesystemRead"

[[permissions]]
type = "FilesystemWrite"

[[permissions]]
type = "Network"

# Tool opt-in declarations (ADR-029).
# Project Manager focuses on requirements analysis, task decomposition,
# progress tracking, risk assessment, and team coordination. Tools cover those
# workflows:
#   - file_*/doc_reader/glob_search/content_search → project docs, status reports
#   - http_request/web_fetch                      → research tools/methodologies
#   - mcp_memory__* (hosted memory MCP, ADR-101)   → project history & decisions
#   - intent_send                                  → coordinate team member agents
#   - ask_user_question, todo_write                → clarify requirements & track tasks
# No shell tools — PM does not hold a Shell permission.

# --- Memory (ADR-101) ---
# `memory_recall` / `memory_store` are no longer built-ins, so nothing is declared
# here: they are tools of the Gateway-hosted memory MCP, opted in per agent in
# `agent_mcp_tools.json` as `mcp_memory__memory_recall` / `mcp_memory__memory_store`
# (ADR-069).

# --- Filesystem ---
[[tools]]
name = "file_edit"

[[tools]]
name = "doc_reader"

# --- Shell (platform-detected; declare all three for cross-platform opt-in) ---
[[tools]]
name = "bash"        # Windows (Git Bash installed)

[[tools]]
name = "powershell"  # Windows (always; pwsh preferred, falls back to Windows PowerShell 5.1)

[[tools]]
name = "shell"       # Linux / macOS

# --- Inter-agent ---
[[tools]]
name = "intent_send"

# --- Workflow ---
[[tools]]
name = "ask_user_question"

[[tools]]
name = "todo_write"

# --- Advanced ---
[[tools]]
name = "load_skill"

[llm]
temperature = 0.5
max_tokens = 32768
context_window = 200000

[llm.routing]
strategy = "quality_priority"
fallback_order = ["openai", "claude"]

[llm.budget]
max_output_tokens = 8192
exceeded_action = "warn"


# ADR-104: behaviour defaults for agent_config.json. Seeded only into
# fields the user has not set; never overwrites a user value.
[config]
temperature = 0.5
context_window = 200000
max_output_tokens = 8192
max_iterations = 40

[memory]
enabled = true
retention_days = 365

[resources]
max_memory_mb = 512
idle_timeout_secs = 3600

[sandbox]
enabled = false

# ADR-104: recommended MCP servers. Recommendation, not installation —
# the user confirms install/activation in the Tools panel (ADR-090).

[[mcp_servers]]
hosted = "pm"
why = "Create and track tasks, dependencies and milestones in the project service"

[[mcp_servers]]
hosted = "memory"
why = "Keep meeting decisions and commitments across sessions"

[capabilities.requirements_analysis]
description = "Analyze and document project requirements into a structured PRD"
skills = ["requirements-analysis"]

[capabilities.task_decomposition]
description = "Break down project goals into actionable tasks with estimates and dependencies"
skills = ["task-decomposition"]

[capabilities.risk_assessment]
description = "Identify, evaluate, and create mitigation plans for project risks"
skills = ["risk-assessment"]

