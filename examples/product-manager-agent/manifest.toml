# Product Manager Agent
# A product manager agent for strategy, discovery, PRD, roadmap, Figma design review, feature acceptance, and launch planning.

agent_id = "com.acowork.product-manager"
version = "1.0.0"
name = "Product"
display_name = "Product"
role = "Product Manager"
description = "A product manager agent skilled in product strategy, user research, PRD writing, roadmap prioritization, Figma design review, feature acceptance, and launch planning."
author = "ACowork Team"
runtime_version = "0.1.0"
dev = false
labels = ["product", "planning"]
avatar = "assets/avatar.jpg"

identity_deps = ["display_name", "language", "timezone"]

[[permissions]]
type = "FilesystemRead"

[[permissions]]
type = "FilesystemWrite"

[[permissions]]
type = "Network"

# Tool opt-in declarations (ADR-029).
# Product Manager focuses on strategy, PRD writing, roadmap prioritization,
# Figma/feature review, and launch planning. Tools cover those workflows:
#   - file_*/doc_reader/glob_search/content_search → PRDs, specs, references
#   - http_request/web_fetch                      → market & competitor research
#   - mcp_memory__* (hosted memory MCP, ADR-101)   → long-term project context
#   - intent_send                                  → coordinate with engineering agents
#   - ask_user_question, todo_write                → gather requirements & track plans
# No shell tools — PM does not hold a Shell permission.

# --- Memory (ADR-101) ---
# `memory_recall` / `memory_store` are no longer built-ins, so nothing is declared
# here: they are tools of the Gateway-hosted memory MCP, opted in per agent in
# `agent_mcp_tools.json` as `mcp_memory__memory_recall` / `mcp_memory__memory_store`
# (ADR-069).

# --- Filesystem ---
[[tools]]
name = "file_edit"

[[tools]]
name = "doc_reader"

# --- Shell (platform-detected; declare all three for cross-platform opt-in) ---
[[tools]]
name = "bash"        # Windows (Git Bash installed)

[[tools]]
name = "powershell"  # Windows (always; pwsh preferred, falls back to Windows PowerShell 5.1)

[[tools]]
name = "shell"       # Linux / macOS

# --- Network ---
[[tools]]
name = "http_request"

[[tools]]
name = "web_fetch"

# --- Inter-agent ---
[[tools]]
name = "intent_send"

# --- Workflow ---
[[tools]]
name = "ask_user_question"

[[tools]]
name = "todo_write"

# --- Advanced ---
[[tools]]
name = "load_skill"

[llm]
temperature = 0.7
max_tokens = 32768
context_window = 200000

[llm.routing]
strategy = "quality_priority"
fallback_order = ["claude", "openai"]

[llm.budget]
max_output_tokens = 8192
exceeded_action = "warn"


# ADR-104: behaviour defaults for agent_config.json. Seeded only into
# fields the user has not set; never overwrites a user value.
[config]
temperature = 0.7
context_window = 200000
max_output_tokens = 8192
max_iterations = 40

[memory]
enabled = true
retention_days = 365

[resources]
max_memory_mb = 512
idle_timeout_secs = 3600

[sandbox]
enabled = false

# ADR-104: recommended MCP servers. Recommendation, not installation —
# the user confirms install/activation in the Tools panel (ADR-090).

[[mcp_servers]]
hosted = "memory"
why = "Remember product context, stakeholders and past decisions across sessions"

[[mcp_servers]]
hosted = "pm"
why = "File requirements and roadmap items as tasks the team can pick up"

[[mcp_servers]]
preset = "figma"
why = "Read Figma designs directly (frames, components, styles) for design review"

[[mcp_servers]]
preset = "notion"
why = "Pull PRDs and specs out of Notion instead of pasting them in"

[capabilities.product_strategy]
description = "Define product vision, target users, positioning, goals, bets, and success metrics"
skills = ["product-strategy"]

[capabilities.user_research]
description = "Plan and synthesize user research, interviews, personas, journeys, and opportunity areas"
skills = ["user-research"]

[capabilities.prd_writing]
description = "Write product requirements with problem framing, user stories, acceptance criteria, metrics, and non-goals"
skills = ["prd-writing"]

[capabilities.roadmap_prioritization]
description = "Prioritize roadmap items using evidence, impact, effort, confidence, risk, and strategic alignment"
skills = ["roadmap-prioritization"]

[capabilities.figma_design_review]
description = "Review Figma designs for product intent, user flow, UX clarity, states, accessibility, and engineering handoff readiness"
skills = ["figma-design-review"]

[capabilities.feature_acceptance]
description = "Validate implemented features against PRD, Figma, acceptance criteria, metrics, and release readiness"
skills = ["feature-acceptance"]

[capabilities.launch_planning]
description = "Plan product launches with rollout, communication, analytics, support readiness, risks, and post-launch learning"
skills = ["launch-planning"]

