# Product Manager Agent
# A product manager agent for strategy, discovery, PRD, roadmap, Figma design review, feature acceptance, and launch planning.

agent_id = "com.acowork.product-manager"
version = "1.2.7"
name = "Product"
role = "Product Manager"
description = "A product manager agent skilled in product strategy, user research, PRD writing, roadmap prioritization, Figma design review, feature acceptance, and launch planning."
author = "ACowork Team"
runtime_version = "0.1.0"
dev = false
labels = ["product", "planning"]
avatar = "assets/avatar.jpg"

identity_deps = ["display_name", "language", "timezone"]

[[permissions]]
type = "FilesystemRead"

[[permissions]]
type = "FilesystemWrite"

[[permissions]]
type = "Network"

# Tool opt-in declarations.
# Product Manager focuses on strategy, PRD writing, roadmap prioritization,
# Figma/feature review, and launch planning. Tools cover those workflows:
#   - file_read/file_edit/doc_reader → PRDs, specs and references
#   - http_request/web_fetch         → market & competitor research
#   - memory                         → long-term project context
#   - intent_send                    → coordinate with engineering agents
#   - ask_user_question/todo_write   → gather requirements & track plans
# No shell tools — PM does not hold a Shell permission.

# --- Filesystem ---
# `file_read` is declared because reviewing a design against an
# implementation means reading the implementation. `file_write` is not
# declared: every Product deliverable is a document and is published with
# `doc_write`.
[[tools]]
name = "file_read"

[[tools]]
name = "image_read"

[[tools]]
name = "file_edit"

[[tools]]
name = "doc_reader"

# --- Shell (platform-detected; declare all three for cross-platform opt-in) ---
[[tools]]
name = "bash"

[[tools]]
name = "powershell"

[[tools]]
name = "shell"

# --- Network ---
[[tools]]
name = "http_request"

[[tools]]
name = "web_fetch"

# --- Inter-agent ---
[[tools]]
name = "intent_send"

# --- Workflow ---
[[tools]]
name = "ask_user_question"

[[tools]]
name = "todo_write"

# --- Advanced ---
[[tools]]
name = "load_skill"

[llm]
temperature = 0.7
max_tokens = 32768
context_window = 200000

[llm.routing]
strategy = "quality_priority"
fallback_order = ["claude", "openai"]

[llm.budget]
max_output_tokens = 8192
exceeded_action = "warn"


# Behaviour defaults for agent_config.json. Seeded only into fields the user
# has not set; never overwrites a user value.
[config]
temperature = 0.7
context_window = 200000
max_output_tokens = 8192
max_iterations = 40

[memory]
enabled = true
retention_days = 365

[resources]
max_memory_mb = 512
idle_timeout_secs = 3600

[sandbox]
enabled = false

# Recommended MCP servers. A recommendation, not an installation — the user
# confirms install/activation in the Tools panel.

[[mcp_servers]]
hosted = "memory"
why = "Remember product context, stakeholders and past decisions across sessions"

[[mcp_servers]]
hosted = "pm"
why = "Claim, work and submit project tasks — the participation surface, not the management one"
# The task tools this agent needs to take part in a project: see the queue it
# was given, read the task and its acceptance criteria, claim it, report
# progress and blockers, and submit the result. The management-plane tools
# (creating projects, changing tasks, managing the roster) stay with the PM
# agent, so the boundary is enforced by the declaration itself rather than by
# prose the model might ignore.
tools = [
  "pm_list_tasks", "pm_get_task", "pm_get_project", "pm_claim_task",
  "pm_submit_task", "pm_add_activity", "pm_list_activity",
]

[[mcp_servers]]
hosted = "doc"
why = "Deliverables go into the shared project document tree instead of local files"
# The same reasoning as `pm` above: this agent reads and writes the shared
# document tree, and moves a finished document to its final name. Deleting is
# left out because removal is the owner's decision, and creating directories
# is left out because the project tree has one owner — the PM agent builds it
# once, so a participant never ends up in charge of a directory it created.
tools = [
  "doc_list", "doc_search", "doc_read", "doc_stat", "doc_write", "doc_move",
  "doc_list_requests", "doc_check_request",
]

[[mcp_servers]]
preset = "figma"
why = "Read Figma designs directly (frames, components, styles) for design review"

[capabilities.product_strategy]
description = "Define product vision, target users, positioning, goals, bets, and success metrics"
skills = ["product-strategy"]

[capabilities.user_research]
description = "Plan and synthesize user research, interviews, personas, journeys, and opportunity areas"
skills = ["user-research"]

[capabilities.prd_writing]
description = "Write product requirements with problem framing, user stories, acceptance criteria, metrics, and non-goals"
skills = ["prd-writing"]

[capabilities.roadmap_prioritization]
description = "Prioritize roadmap items using evidence, impact, effort, confidence, risk, and strategic alignment"
skills = ["roadmap-prioritization"]

[capabilities.figma_design_review]
description = "Review Figma designs for product intent, user flow, UX clarity, states, accessibility, and engineering handoff readiness"
skills = ["figma-design-review"]

[capabilities.feature_acceptance]
description = "Validate implemented features against PRD, Figma, acceptance criteria, metrics, and release readiness"
skills = ["feature-acceptance"]

[capabilities.launch_planning]
description = "Plan product launches with rollout, communication, analytics, support readiness, risks, and post-launch learning"
skills = ["launch-planning"]

# The participation capability is listed last because it is the one every other
# capability in this package runs inside: a project task is claimed, its
# deliverable published to the project document tree, and its result
# submitted through the task service. Declaring it is what makes the
# participation skill ship-checked at packaging time and what makes it show in
# the capability panel.
[capabilities.project_participation]
description = "Claim, publish and submit work in a project: accept a dispatched task, publish its deliverable to the project document tree, record blockers and handoffs as activity, and submit the result"
skills = ["project-participation"]
