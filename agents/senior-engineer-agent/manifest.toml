# Senior Software Engineer Agent
# A multi-skilled senior engineer for code review, architecture, debugging, refactoring, testing, and documentation.

agent_id = "com.acowork.senior-engineer"
version = "1.0.0"
name = "SSE"
role = "Senior Software Engineer"
description = "An experienced senior software engineer capable of code review, architecture design, debugging, refactoring, testing, and documentation."
author = "ACowork Team"
runtime_version = "0.1.0"
dev = false
labels = ["engineering", "coding"]
avatar = "assets/avatar.jpg"

identity_deps = ["language", "timezone"]

[[permissions]]
type = "FilesystemRead"

[[permissions]]
type = "FilesystemWrite"

[[permissions]]
type = "Network"

[[permissions]]
type = "Shell"

# Built-in tool opt-in declarations (ADR-029)
# Each [[tools]] entry seeds `agent_tools.json` with `enabled = true` on first start.
# Tools NOT listed here are registered in code but kept disabled (opt-in model).
#
# Conditionally-registered tools (no-ops when runtime lacks the required capability):
#   - `codebase`  : requires an LSP Relay endpoint
#   - shell tools : names are platform-detected. We declare all three (`bash`,
#                   `powershell`, `shell`) so a senior engineer always has shell
#                   access on every platform — `init_tools_config_from_manifest`
#                   silently drops names that the runtime hasn't registered.

# --- Memory (ADR-101) ---
# `memory_recall` / `memory_store` are no longer built-ins, so nothing is declared
# here: they are tools of the Gateway-hosted memory MCP, opted in per agent in
# `agent_mcp_tools.json` as `mcp_memory__memory_recall` / `mcp_memory__memory_store`
# (ADR-069).

# --- Filesystem ---
# `file_read` is declared for the skills that inspect repository sources
# (architecture-design, code-review, debugging, refactoring, testing — plan
# §4.4 allowlist). `file_write` is declared here and nowhere else: these three
# skills produce repository source, not documents, and `dev/ci.sh`
# (`run_agent_skill_tool_redline`) fails on a fourth.
[[tools]]
name = "file_read"

[[tools]]
name = "file_edit"

[[tools]]
name = "file_write"

# --- Shell (platform-detected; declare all three for cross-platform opt-in) ---
[[tools]]
name = "bash"        # Windows (Git Bash installed)

[[tools]]
name = "powershell"  # Windows (always; pwsh preferred, falls back to Windows PowerShell 5.1)

[[tools]]
name = "shell"       # Linux / macOS

# --- Inter-agent messaging ---
[[tools]]
name = "intent_send"

# --- Workflow primitives ---
[[tools]]
name = "ask_user_question"

[[tools]]
name = "todo_write"

# --- Advanced ---
[[tools]]
name = "load_skill"

[llm]
temperature = 0.1
max_tokens = 32768
context_window = 200000

[llm.routing]
strategy = "quality_priority"
fallback_order = ["openai", "claude"]

[llm.budget]
max_output_tokens = 8192
exceeded_action = "warn"


# ADR-104: behaviour defaults for agent_config.json. Seeded only into
# fields the user has not set; never overwrites a user value.
[config]
temperature = 0.3
context_window = 200000
max_output_tokens = 8192
max_iterations = 40

[memory]
enabled = true
retention_days = 180

[resources]
max_memory_mb = 512
idle_timeout_secs = 3600

[sandbox]
enabled = false

# ADR-104: recommended MCP servers. Recommendation, not installation —
# the user confirms install/activation in the Tools panel (ADR-090).

[[mcp_servers]]
hosted = "memory"
why = "Recall architecture decisions and earlier debugging findings"

[[mcp_servers]]
hosted = "pm"
why = "Claim, work and submit project tasks — the participation surface, not the management one"
# ADR-104: the whitelist is the initial enabled set, so it is exactly the set the
# package's skills declare in `tool_deps` (plan §4.3). Deliberately absent are the
# management-plane tools — `pm_update_task`, `pm_create_project`,
# `pm_update_project`, `pm_add_project_member`, `pm_list_agents` (plan D-1): the
# boundary is enforced by the whitelist, not by skill prose.
tools = [
  "pm_list_tasks", "pm_get_task", "pm_get_project", "pm_claim_task",
  "pm_submit_task", "pm_add_activity", "pm_list_activity", "pm_create_task",
]

[[mcp_servers]]
hosted = "doc"
why = "Deliverables go into the shared project document tree instead of local files"
# Same rule as `pm` above. `doc_remove` / `doc_rmdir` are absent because deleting
# is the owner's right (plan D-5), and `doc_mkdir` is absent because the project
# tree has exactly one governor — the PM agent (plan D-2 / D-7): a participant
# that mkdirs an area directory would end up the only one able to rename or prune
# it. A missing area is reported through `pm_add_activity`, not self-created.
# Code itself still lands in the repository through `file_write` — the document
# tree carries the reasoning, the review verdict and the post-mortem.
tools = [
  "doc_list", "doc_search", "doc_read", "doc_stat", "doc_write", "doc_move",
  "doc_list_requests", "doc_check_request",
]

[[mcp_servers]]
preset = "context7"
why = "Check current, version-specific library APIs before recommending code"

[[mcp_servers]]
preset = "brave-search"
why = "Look up errors and release notes the local docs do not cover"
required_secrets = ["BRAVE_API_KEY"]

[capabilities.code_review]
description = "Perform a thorough code review with actionable feedback"
skills = ["code-review"]

[capabilities.architecture_design]
description = "Design system architecture with module breakdown and interface definitions"
skills = ["architecture-design"]

[capabilities.debug_assist]
description = "Debug and troubleshoot issues with systematic root-cause analysis"

# The participation capability is listed last because it is the one the other
# skills run inside: a project task is claimed, its deliverable published to the
# project document tree, and its result submitted through PM. Declaring it is
# what makes `validate_capability_skills` check `project-participation` at
# packaging time and what makes it show in the capability panel (ADR-104).
[capabilities.project_participation]
description = "Claim, publish and submit work in a project: accept a dispatched task, publish its deliverable to the project document tree, record blockers and handoffs as activity, and submit the result"
skills = ["project-participation"]
