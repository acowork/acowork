<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 560" width="100%" height="100%" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b5cf6" />
    </marker>
    <marker id="a-purple-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b5cf6" />
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0ea5e9" />
    </marker>
    <marker id="a-blue-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0ea5e9" />
    </marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b" />
    </marker>
    <marker id="a-orange-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b" />
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a" />
    </marker>
    <marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8" />
    </marker>
  </defs>

  <rect width="1160" height="560" fill="#ffffff" rx="12" />

  <!-- ==================== HUMANS ==================== -->
  <g>
    <rect x="490" y="42" width="180" height="42" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
    <text x="580" y="68" text-anchor="middle" fill="#1e3a8a" font-size="15" font-weight="700">👤 Humans</text>
  </g>

  <!-- Humans → clients (orthogonal fan-out) -->
  <line x1="580" y1="84" x2="580" y2="100" stroke="#94a3b8" stroke-width="2" />
  <line x1="380" y1="100" x2="780" y2="100" stroke="#94a3b8" stroke-width="2" />
  <line x1="380" y1="100" x2="380" y2="114" stroke="#94a3b8" stroke-width="2" marker-end="url(#a-slate)" />
  <line x1="780" y1="100" x2="780" y2="114" stroke="#94a3b8" stroke-width="2" marker-end="url(#a-slate)" />

  <!-- ==================== DESKTOP APP ==================== -->
  <g>
    <rect x="250" y="118" width="260" height="44" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" />
    <text x="380" y="146" text-anchor="middle" fill="#92400e" font-size="14" font-weight="700">Desktop App · Tauri v2</text>
  </g>
  <line x1="380" y1="162" x2="380" y2="198" stroke="#0ea5e9" stroke-width="2" marker-end="url(#a-blue)" marker-start="url(#a-blue-s)" />
  <text x="394" y="185" fill="#0369a1" font-size="11" font-weight="600">HTTP · MQTT</text>

  <!-- ==================== MOBILE APP ==================== -->
  <g>
    <rect x="650" y="118" width="260" height="44" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" />
    <text x="780" y="146" text-anchor="middle" fill="#92400e" font-size="14" font-weight="700">Mobile App · Tauri v2</text>
  </g>
  <line x1="780" y1="162" x2="780" y2="198" stroke="#0ea5e9" stroke-width="2" marker-end="url(#a-blue)" marker-start="url(#a-blue-s)" />
  <text x="794" y="185" fill="#0369a1" font-size="11" font-weight="600">HTTP · MQTT</text>

  <!-- ==================== GATEWAY ==================== -->
  <g>
    <rect x="130" y="202" width="900" height="76" rx="12" fill="#faf5ff" stroke="#8b5cf6" stroke-width="2" />
    <text x="580" y="233" text-anchor="middle" fill="#5b21b6" font-size="16" font-weight="700">acowork-gateway</text>
    <text x="580" y="257" text-anchor="middle" fill="#7c3aed" font-size="12">:19876 HTTP · :19875 MQTT</text>
  </g>

  <!-- Gateway ⇄ co-resident services -->
  <line x1="270" y1="278" x2="270" y2="340" stroke="#f59e0b" stroke-width="2" marker-end="url(#a-orange)" marker-start="url(#a-orange-s)" />
  <text x="284" y="313" fill="#b45309" font-size="11" font-weight="600">REST · MCP</text>

  <!-- Gateway ⇄ agent host A -->
  <line x1="580" y1="278" x2="580" y2="340" stroke="#8b5cf6" stroke-width="2" marker-end="url(#a-purple)" marker-start="url(#a-purple-s)" />
  <text x="594" y="313" fill="#7c3aed" font-size="11" font-weight="600">MQTT · HTTP</text>

  <!-- Gateway ⇄ agent host B -->
  <line x1="890" y1="278" x2="890" y2="340" stroke="#8b5cf6" stroke-width="2" marker-end="url(#a-purple)" marker-start="url(#a-purple-s)" />
  <text x="904" y="313" fill="#7c3aed" font-size="11" font-weight="600">MQTT · HTTP</text>

  <!-- ==================== CO-RESIDENT SERVICES ==================== -->
  <g>
    <rect x="130" y="344" width="280" height="176" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="146" y="368" fill="#64748b" font-size="11" font-weight="700">Co-resident services</text>

    <rect x="146" y="382" width="248" height="28" rx="7" fill="#ffffff" stroke="#e2e8f0" />
    <text x="270" y="401" text-anchor="middle" fill="#334155" font-size="12" font-weight="600">acowork-user</text>

    <rect x="146" y="416" width="248" height="28" rx="7" fill="#ffffff" stroke="#e2e8f0" />
    <text x="270" y="435" text-anchor="middle" fill="#334155" font-size="12" font-weight="600">acowork-pm</text>

    <rect x="146" y="450" width="248" height="28" rx="7" fill="#ffffff" stroke="#e2e8f0" />
    <text x="270" y="469" text-anchor="middle" fill="#334155" font-size="12" font-weight="600">acowork-doc</text>

    <rect x="146" y="484" width="248" height="28" rx="7" fill="#ffffff" stroke="#e2e8f0" />
    <text x="270" y="503" text-anchor="middle" fill="#334155" font-size="12" font-weight="600">acowork-memory</text>
  </g>

  <!-- ==================== AGENT HOST A ==================== -->
  <g>
    <rect x="440" y="344" width="280" height="176" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="456" y="368" fill="#64748b" font-size="11" font-weight="700">Agent host A</text>

    <rect x="456" y="382" width="248" height="44" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
    <text x="580" y="410" text-anchor="middle" fill="#15803d" font-size="13" font-weight="700">acowork-node · :19900</text>

    <rect x="456" y="456" width="248" height="44" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
    <text x="580" y="484" text-anchor="middle" fill="#334155" font-size="13" font-weight="700">acowork-runtime × N</text>
  </g>
  <line x1="580" y1="426" x2="580" y2="452" stroke="#16a34a" stroke-width="2" marker-end="url(#a-green)" />
  <text x="592" y="444" fill="#15803d" font-size="11" font-weight="600">spawn</text>

  <!-- ==================== AGENT HOST B ==================== -->
  <g>
    <rect x="750" y="344" width="280" height="176" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="766" y="368" fill="#64748b" font-size="11" font-weight="700">Agent host B</text>

    <rect x="766" y="382" width="248" height="44" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
    <text x="890" y="410" text-anchor="middle" fill="#15803d" font-size="13" font-weight="700">acowork-node · :19900</text>

    <rect x="766" y="456" width="248" height="44" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
    <text x="890" y="484" text-anchor="middle" fill="#334155" font-size="13" font-weight="700">acowork-runtime × N</text>
  </g>
  <line x1="890" y1="426" x2="890" y2="452" stroke="#16a34a" stroke-width="2" marker-end="url(#a-green)" />
  <text x="902" y="444" fill="#15803d" font-size="11" font-weight="600">spawn</text>
</svg>
