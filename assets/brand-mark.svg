<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 364.25 96" width="364.25" height="96" role="img" aria-label="ACowork">
  <title>ACowork</title>
  <!-- Frame = the artwork's ink box + a uniform 6px gutter, so the mark reads
       centred in whatever frame renders it (workspace preview, login, splash).
       Ink box (solid geometry, shadow excluded) is x 14..366.25, y 2..86 in the
       artwork's own coordinates; translate(-8 4) moves its top-left corner to
       (6, 6), hence viewBox 0 0 364.25 96. Keep them in step:
         width  = ink width  + 2*6 = 352.25 + 12
         height = ink height + 2*6 = 84.00 + 12
       Re-measure rather than estimate: render at 4x on a transparent
       background and take the alpha bounding box twice: once as shipped,
       once with the drop-shadow filter dropped from the chip rect.
       The wordmark is live <text>, and an SVG loaded through <img> cannot use
       the app's @font-face — it lands on whatever local font matches. textLength
       pins the advance so the right gutter does not move with the font (Segoe UI /
       Arial / Liberation / SF differ by up to 8px; Verdana would overflow).
       lengthAdjust="spacing" adjusts tracking only — glyphs stay undistorted. -->
  <defs>
    <linearGradient id="bg" x1="14" y1="2" x2="98" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F7C948"/>
      <stop offset="100%" stop-color="#F0A92E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <!-- Bite-mask: white rect reveals the dot; small black circle carves the C-notch.
         Big circle: cx=56, bottom aligned with the strokes' bottom centerline
         (cy + r = 68) AND tangent to both strokes' inner edges (half-stroke 5,
         inner edges at x=37/73 → half-distance 18 from center 56, i.e. 43.5/2...
         wait: left stroke midline (32,68)→(56,20), offset 5 toward center →
         inner edge x at bottom = 32+5·0.8944 = 36.47, right = 80−5·0.8944=75.53;
         the tangent solve (dist((56,cy),inner-edge line)=r, cy+r=68) gives
         r = 11.38, cy = 56.62 (both legs agree by symmetry).
         Small circle: keeps its relative position inside the big circle
         (center 0.5r right of big center, vertically centered) and scales
         with it: r = 5.69, cx = 56 + 5.69 = 61.69, cy = 56.62. -->
    <mask id="bite" maskUnits="userSpaceOnUse" x="44.62" y="45.24" width="22.76" height="22.76">
      <rect x="44.62" y="45.24" width="22.76" height="22.76" fill="white"/>
      <circle cx="61.69" cy="56.62" r="5.69" fill="black"/>
    </mask>
  </defs>
  <g transform="translate(-8 4)">
  <!-- warm yellow icon background -->
  <rect x="14" y="2" width="84" height="84" rx="20" ry="20" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- in-mark A: two strokes + a circle (replaces the crossbar).
       A width = 48 (chip 84, ~12.5px visual margin each side).
       Circle moved up to be tangent to the inner edges of both diagonals; diameter 20.4.
       Strokes are separated at the apex: the left stroke runs to the apex,
       the right stroke ends short with its own round cap (centerline end
       (63.4,34.8), ~16.5 px from the apex) leaving a ~3 px gap. -->
  <!-- "A" group: scaled to 90% (–10%) around the in-tile center (56,44).
       Includes both strokes AND the C-notch dot — the dot replaces the A's
       crossbar, so it must shrink with the strokes to keep the "A" as a
       single coherent glyph. (A bbox incl. dot: x 32→80, y 20→68, center
       exactly the icon-tile center.) Stroke-width / radius shrink together
       to preserve the stroke-to-edge ratio. -->
  <g transform="translate(56 44) scale(0.9) translate(-56 -44)">
    <path d="M32 68 L56 20"
          fill="none"
          stroke="#303030"
          stroke-width="10"
          stroke-linecap="round"/>
    <path d="M63.4 34.8 L80 68"
          fill="none"
          stroke="#606060"
          stroke-width="10"
          stroke-linecap="round"/>
    <circle cx="56" cy="56.62" r="11.38" fill="#404040" mask="url(#bite)"/>
  </g>
  <!-- tighter, cleaner wordmark -->
  <text textLength="257.53" lengthAdjust="spacing" x="106" y="71"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-weight="700"
        font-size="74"
        fill="#1F2937"
        letter-spacing="-2.1">
    <tspan fill="#23A36F">Co</tspan><tspan fill="#4D7CF3" dx="4">work</tspan>
  </text>
  </g>
</svg>
