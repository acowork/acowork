# Quality Assurance Agent
# A quality management agent for test strategy, test planning, defect management, release acceptance, and regression control.

agent_id = "com.acowork.quality-assurance"
version = "1.1.7"
name = "QA"
role = "Quality Assurance Manager"
description = "A quality assurance and quality management agent skilled in quality strategy, test planning, test case design, defect triage, regression management, release acceptance, and continuous quality improvement."
author = "ACowork Team"
runtime_version = "0.1.0"
dev = false
labels = ["quality", "testing"]
avatar = "assets/avatar.jpg"

identity_deps = ["display_name", "language", "timezone"]

[[permissions]]
type = "FilesystemRead"

[[permissions]]
type = "FilesystemWrite"

[[permissions]]
type = "Network"

# Tool opt-in declarations.
# QA Manager focuses on quality strategy, test planning, test case design,
# defect management, release acceptance, and regression management. This is a
# planning/management role, not a test-execution role — tools cover authoring
# and review, not running test commands:
#   - file_read/file_edit/doc_reader → test plans, cases, defect reports
#   - http_request/web_fetch         → research test tools & practices
#   - memory                        → quality history & known issues
#   - intent_send                   → coordinate with dev/PM agents
#   - ask_user_question/todo_write  → clarify acceptance & track plans
# No shell tools — this QA role is management-focused, not test execution.

# --- Filesystem ---
# `file_read` is declared because deriving test cases from code means reading
# the code. `file_write` is not declared: QA deliverables are documents and are
# published with `doc_write`.
[[tools]]
name = "file_read"

[[tools]]
name = "image_read"

[[tools]]
name = "file_edit"

[[tools]]
name = "doc_reader"

# --- Shell (platform-detected; declare all three for cross-platform opt-in) ---
[[tools]]
name = "bash"

[[tools]]
name = "powershell"

[[tools]]
name = "shell"

# --- Inter-agent ---
[[tools]]
name = "intent_send"

# --- Workflow ---
[[tools]]
name = "ask_user_question"

[[tools]]
name = "todo_write"

# --- Advanced ---
[[tools]]
name = "load_skill"

[llm]
temperature = 0.1
max_tokens = 32768
context_window = 200000

[llm.routing]
strategy = "quality_priority"
fallback_order = ["claude", "openai"]

[llm.budget]
max_output_tokens = 8192
exceeded_action = "warn"


# Behaviour defaults for agent_config.json. Seeded only into fields the user
# has not set; never overwrites a user value.
[config]
temperature = 0.3
context_window = 200000
max_output_tokens = 8192
max_iterations = 40

[memory]
enabled = true
retention_days = 365

[resources]
max_memory_mb = 512
idle_timeout_secs = 3600

[sandbox]
enabled = false

# Recommended MCP servers. A recommendation, not an installation — the user
# confirms install/activation in the Tools panel.

[[mcp_servers]]
hosted = "pm"
why = "Claim, work and submit project tasks — the participation surface, not the management one"
# The task tools this agent needs to take part in a project: see the queue it
# was given, read the task and its acceptance criteria, claim it, report
# progress and blockers, and submit the result. The management-plane tools
# (creating projects, changing tasks, managing the roster) stay with the PM
# agent, so the boundary is enforced by the declaration itself rather than by
# prose the model might ignore.
tools = [
  "pm_list_tasks", "pm_get_task", "pm_get_project", "pm_claim_task",
  "pm_submit_task", "pm_add_activity", "pm_list_activity",
]

[[mcp_servers]]
hosted = "doc"
why = "Deliverables go into the shared project document tree instead of local files"
# The same reasoning as `pm` above: this agent reads and writes the shared
# document tree, and moves a finished document to its final name. Deleting is
# left out because removal is the owner's decision, and creating directories
# is left out because the project tree has one owner — the PM agent builds it
# once, so a participant never ends up in charge of a directory it created.
tools = [
  "doc_list", "doc_search", "doc_read", "doc_stat", "doc_write", "doc_move",
  "doc_list_requests", "doc_check_request",
]

[[mcp_servers]]
preset = "playwright"
why = "Drive the web UI to reproduce defects and verify acceptance criteria"

[capabilities.quality_strategy]
description = "Define quality objectives, risk-based quality gates, metrics, and continuous improvement plans"
skills = ["quality-strategy"]

[capabilities.test_planning]
description = "Create test plans with scope, levels, environments, responsibilities, risks, and schedules"

[capabilities.test_case_design]
description = "Design behavior-focused test cases covering functional, non-functional, boundary, negative, and regression scenarios"
skills = ["test-case-design"]

[capabilities.defect_management]
description = "Triage, classify, prioritize, track, and report defects through resolution and verification"
skills = ["defect-management"]

[capabilities.release_acceptance]
description = "Assess release readiness using quality gates, known issues, risk acceptance, and go/no-go criteria"
skills = ["release-acceptance"]

[capabilities.regression_management]
description = "Plan and maintain regression suites based on risk, change impact, defect history, and automation value"
skills = ["regression-management"]

# The participation capability is listed last because it is the one every other
# capability in this package runs inside: a project task is claimed, its
# deliverable published to the project document tree, and its result
# submitted through the task service. Declaring it is what makes the
# participation skill ship-checked at packaging time and what makes it show in
# the capability panel.
[capabilities.project_participation]
description = "Claim, publish and submit work in a project: accept a dispatched task, publish its deliverable to the project document tree, record blockers and handoffs as activity, and submit the result"
skills = ["project-participation"]
