# Senior Software Engineer Agent
# A multi-skilled senior engineer for code review, architecture, debugging, refactoring, testing, and documentation.

agent_id = "com.acowork.senior-engineer"
version = "1.2.10"
name = "SSE"
role = "Senior Software Engineer"
description = "An experienced senior software engineer capable of code review, architecture design, debugging, refactoring, testing, and documentation."
author = "ACowork Team"
runtime_version = "0.1.0"
dev = false
labels = ["engineering", "coding"]
avatar = "assets/avatar.jpg"

identity_deps = ["language", "timezone"]

[[permissions]]
type = "FilesystemRead"

[[permissions]]
type = "FilesystemWrite"

[[permissions]]
type = "Network"

[[permissions]]
type = "Shell"

# Built-in tool opt-in declarations.
# Each [[tools]] entry seeds `agent_tools.json` with `enabled = true` on first start.
# Tools NOT listed here are registered in code but kept disabled (opt-in model).
#
# Conditionally-registered tools (no-ops when runtime lacks the required capability):
#   - `codebase`  : requires an LSP Relay endpoint
#   - shell tools : names are platform-detected. We declare all three (`bash`,
#                   `powershell`, `shell`) so a senior engineer always has shell
#                   access on every platform — `init_tools_config_from_manifest`
#                   silently drops names that the runtime hasn't registered.

# --- Filesystem ---
# `file_read` is declared for the skills that inspect repository sources
# (architecture-design, code-review, debugging, refactoring, testing).
# `file_write` is declared here and nowhere else: these skills produce
# repository source, not documents.
[[tools]]
name = "file_read"

[[tools]]
name = "image_read"

[[tools]]
name = "file_edit"

[[tools]]
name = "doc_reader"

[[tools]]
name = "file_write"

# --- Shell (platform-detected; declare all three for cross-platform opt-in) ---
[[tools]]
name = "bash"

[[tools]]
name = "powershell"

[[tools]]
name = "shell"

# --- Inter-agent messaging ---
[[tools]]
name = "intent_send"

# --- Workflow primitives ---
[[tools]]
name = "ask_user_question"

[[tools]]
name = "todo_write"

# --- Advanced ---
[[tools]]
name = "load_skill"

[llm]
temperature = 0.1
max_tokens = 32768
context_window = 200000

[llm.routing]
strategy = "quality_priority"
fallback_order = ["openai", "claude"]

[llm.budget]
max_output_tokens = 8192
exceeded_action = "warn"


# Behaviour defaults for agent_config.json. Seeded only into fields the user
# has not set; never overwrites a user value.
[config]
temperature = 0.3
context_window = 200000
max_output_tokens = 8192
max_iterations = 40

[memory]
enabled = true
retention_days = 180

[resources]
max_memory_mb = 512
idle_timeout_secs = 3600

[sandbox]
enabled = false

# Recommended MCP servers. A recommendation, not an installation — the user
# confirms install/activation in the Tools panel.

[[mcp_servers]]
hosted = "memory"
why = "Recall architecture decisions and earlier debugging findings"

[[mcp_servers]]
hosted = "pm"
why = "Claim, work and submit project tasks — the participation surface, not the management one"
# The task tools this agent needs to take part in a project: see the queue it
# was given, read the task and its acceptance criteria, claim it, report
# progress and blockers, and submit the result. The management-plane tools
# (creating projects, changing tasks, managing the roster) stay with the PM
# agent, so the boundary is enforced by the declaration itself rather than by
# prose the model might ignore.
tools = [
  "pm_list_tasks", "pm_get_task", "pm_get_project", "pm_claim_task",
  "pm_submit_task", "pm_add_activity", "pm_list_activity",
]

[[mcp_servers]]
hosted = "doc"
why = "Deliverables go into the shared project document tree instead of local files"
# The same reasoning as `pm` above: this agent reads and writes the shared
# document tree, and moves a finished document to its final name. Deleting is
# left out because removal is the owner's decision, and creating directories
# is left out because the project tree has one owner — the PM agent builds it
# once, so a participant never ends up in charge of a directory it created.
# The code itself still lands in the repository through `file_write` — the
# document tree carries the reasoning, the review verdict and the post-mortem.
tools = [
  "doc_list", "doc_search", "doc_read", "doc_stat", "doc_write", "doc_move",
  "doc_list_requests", "doc_check_request",
]

[[mcp_servers]]
preset = "context7"
why = "Check current, version-specific library APIs before recommending code"

[capabilities.code_review]
description = "Perform a thorough code review with actionable feedback"
skills = ["code-review"]

[capabilities.architecture_design]
description = "Design system architecture with module breakdown and interface definitions"
skills = ["architecture-design"]

[capabilities.debug_assist]
description = "Debug and troubleshoot issues with systematic root-cause analysis"

# The participation capability is listed last because it is the one every other
# capability in this package runs inside: a project task is claimed, its
# deliverable published to the project document tree, and its result
# submitted through the task service. Declaring it is what makes the
# participation skill ship-checked at packaging time and what makes it show in
# the capability panel.
[capabilities.project_participation]
description = "Claim, publish and submit work in a project: accept a dispatched task, publish its deliverable to the project document tree, record blockers and handoffs as activity, and submit the result"
skills = ["project-participation"]
