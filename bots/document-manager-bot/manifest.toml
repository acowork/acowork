# Document Manager Agent
# A documentation management agent for collection, organization, archiving, writing, format conversion, and knowledge base maintenance.

agent_id = "com.acowork.document-manager"
version = "1.1.9"
name = "Docs"
role = "Document Manager"
description = "A document management agent skilled in collecting, organizing, archiving, writing, reviewing, converting, and maintaining documentation and knowledge bases."
author = "ACowork Team"
runtime_version = "0.1.0"
dev = false
labels = ["documents", "knowledge-base"]
avatar = "assets/avatar.jpg"

identity_deps = ["display_name", "language", "timezone"]

[[permissions]]
type = "FilesystemRead"

[[permissions]]
type = "FilesystemWrite"

[[permissions]]
type = "Network"

# Tool opt-in declarations.
# Document Manager focuses on collecting, organizing, archiving, writing,
# reviewing, and converting documentation. Tools cover the full doc lifecycle:
#   - doc_*    (hosted document service) → THE library and the system of record:
#                                          read/write/move/trash/restore,
#                                          review requests, versions
#   - pm_*     (hosted project service)  → collection, conversion and archive
#                                          chores as tasks with owners and dates
#   - doc_reader                         → one-off PDF/Word/Excel/PowerPoint extraction
#   - http_request/web_fetch             → gather external references
#   - memory                             → knowledge-base persistence across sessions
#   - intent_send                        → coordinate with content-owner agents
#   - ask_user_question, todo_write      → clarify scope & track doc tasks
#
# Shell tools are declared as a cross-platform detection set, not a core
# workflow dependency: document work goes through doc_* (format conversion
# through the docling preset), so the declarations stay only so a job that
# genuinely needs a local command can run one after the user grants it.

# --- Filesystem ---
# `file_read` is what the collection flow uses to inspect a workspace file before
# handing its content to `doc_write`: `doc_write`'s source_workspace / source_path
# only record provenance, they do not read the file.
[[tools]]
name = "file_read"

[[tools]]
name = "file_edit"

[[tools]]
name = "image_read"

[[tools]]
name = "doc_reader"

# --- Shell (platform-detected; declare all three for cross-platform opt-in) ---
[[tools]]
name = "bash"

[[tools]]
name = "powershell"

[[tools]]
name = "shell"

# --- Network ---
[[tools]]
name = "http_request"

[[tools]]
name = "web_fetch"

# --- Inter-agent ---
[[tools]]
name = "intent_send"

# --- Workflow ---
[[tools]]
name = "ask_user_question"

[[tools]]
name = "todo_write"

# --- Advanced ---
[[tools]]
name = "load_skill"

[llm]
temperature = 0.3
max_tokens = 65536
context_window = 250000

[llm.routing]
strategy = "quality_priority"
fallback_order = ["claude", "openai"]

[llm.budget]
max_output_tokens = 8192
exceeded_action = "warn"


# Behaviour defaults for agent_config.json. Seeded only into fields the user
# has not set; never overwrites a user value.
[config]
temperature = 0.4
context_window = 200000
max_output_tokens = 8192
max_iterations = 40

[memory]
enabled = true
retention_days = 365

[resources]
max_memory_mb = 512
idle_timeout_secs = 3600

[sandbox]
enabled = false

# Recommended MCP servers. A recommendation, not an installation — the user
# confirms install/activation in the Tools panel.

[[mcp_servers]]
hosted = "doc"
why = "Read and write the shared document library instead of local files"
# The library is this agent's main working surface, so it gets the full set
# including the delete, trash and restore operations — an archivist needs to
# be able to retire a document, and it is the only role that curates the
# library's own structure.
tools = [
  "doc_list", "doc_read", "doc_stat", "doc_search", "doc_write",
  "doc_move", "doc_remove", "doc_mkdir", "doc_rmdir",
  "doc_check_request", "doc_list_requests",
  "doc_list_trash", "doc_restore",
]

[[mcp_servers]]
hosted = "pm"
why = "Collection, conversion and archive chores are reported on the task thread with owners and dates instead of living in notes"
# The task tools this agent needs to take part in a project: see the queue it
# was given, read the task and its acceptance criteria, claim it, report
# progress and blockers, and submit the result. Creating a task stays with
# the PM agent — a participant that files its own cards competes with the
# PM's own dispatch — so findings are reported through `pm_add_activity`
# instead and the PM raises the card.
tools = [
  "pm_list_tasks", "pm_get_task", "pm_get_project", "pm_claim_task",
  "pm_submit_task", "pm_add_activity", "pm_list_activity",
]

[[mcp_servers]]
preset = "docling"
why = "Convert PDF / Office files the built-in doc_reader cannot parse"

[capabilities.document_collection]
description = "Collect source documents, references, meeting notes, specs, and links with provenance and scope tracking"
skills = ["document-collection"]

[capabilities.document_organization]
description = "Organize documents into clear information architecture, indexes, categories, tags, and navigation"
skills = ["document-organization"]

[capabilities.document_writing]
description = "Write clear technical, product, process, and knowledge-base documentation for target audiences"
skills = ["document-writing"]

[capabilities.format_conversion]
description = "Convert documentation between Markdown, HTML, plain text, structured templates, and other supported formats"
skills = ["format-conversion"]

[capabilities.archive_management]
description = "Archive documents with versioning, retention rules, metadata, provenance, and retrieval paths"
skills = ["archive-management"]

[capabilities.knowledge_base_maintenance]
description = "Maintain knowledge bases by deduplicating, linking, updating, deprecating, and curating content"
skills = ["knowledge-base-maintenance"]

[capabilities.document_quality_review]
description = "Review documents for accuracy, completeness, clarity, structure, consistency, links, and freshness"
skills = ["document-quality-review"]
