# Project Manager Agent
# A professional project manager for requirements, planning, tracking, risk, and communication.

agent_id = "com.acowork.project-manager"
version = "1.2.7"
name = "PM"
role = "Project Manager"
description = "A professional project manager skilled in requirements analysis, task decomposition, progress tracking, risk assessment, and team coordination."
author = "ACowork Team"
runtime_version = "0.1.0"
dev = false
labels = ["project-management", "planning"]
avatar = "assets/avatar.jpg"

identity_deps = ["display_name", "language", "timezone"]

[[permissions]]
type = "FilesystemRead"

[[permissions]]
type = "FilesystemWrite"

[[permissions]]
type = "Network"

# Tool opt-in declarations.
# Project Manager focuses on requirements analysis, task decomposition,
# progress tracking, risk assessment, and team coordination. Tools cover those
# workflows:
#   - pm_*     (hosted project service) → THE task system of record:
#                                          projects, tasks, assignment,
#                                          approval gates, activity
#   - doc_*    (hosted document service)→ PRDs, plans, reports and notes:
#                                          versioned, shared, reviewable
#   - memory                         → project history & decisions
#   - intent_send                    → coordinate team member agents
#   - ask_user_question, todo_write  → clarify requirements & track tasks
#   - doc_reader                     → one-off PDF/Office extraction
#
# Shell tools are declared as a cross-platform detection set, not a core
# workflow dependency: PM work happens through pm_* and doc_*, and the
# declarations stay so a task that genuinely needs a local command can use one
# after the user grants it.

# --- Filesystem ---
[[tools]]
name = "file_edit"

[[tools]]
name = "image_read"

[[tools]]
name = "doc_reader"

# --- Shell (platform-detected; declare all three for cross-platform opt-in) ---
[[tools]]
name = "bash"

[[tools]]
name = "powershell"

[[tools]]
name = "shell"

# --- Inter-agent ---
[[tools]]
name = "intent_send"

# --- Workflow ---
[[tools]]
name = "ask_user_question"

[[tools]]
name = "todo_write"

# --- Advanced ---
[[tools]]
name = "load_skill"

[llm]
temperature = 0.5
max_tokens = 32768
context_window = 200000

[llm.routing]
strategy = "quality_priority"
fallback_order = ["openai", "claude"]

[llm.budget]
max_output_tokens = 8192
exceeded_action = "warn"


# Behaviour defaults for agent_config.json. Seeded only into fields the user
# has not set; never overwrites a user value.
[config]
temperature = 0.5
context_window = 200000
max_output_tokens = 8192
max_iterations = 40

[memory]
enabled = true
retention_days = 365

[resources]
max_memory_mb = 512
idle_timeout_secs = 3600

[sandbox]
enabled = false

# Recommended MCP servers. A recommendation, not an installation — the user
# confirms install/activation in the Tools panel.

[[mcp_servers]]
hosted = "pm"
why = "Create and track tasks, dependencies and milestones in the project service"
# This is the PM's own tool surface, so it is the full set: setting up
# projects, keeping the member roster, and creating, dispatching and closing
# tasks. Every other agent in a project gets only the participation slice of
# this surface, so the separation between the person who plans the work and
# the people who execute it is enforced by the declarations themselves.
tools = [
  "pm_list_projects", "pm_get_project", "pm_create_project", "pm_update_project",
  "pm_add_project_member", "pm_list_agents",
  "pm_create_task", "pm_get_task", "pm_list_tasks", "pm_update_task",
  "pm_claim_task", "pm_submit_task",
  "pm_add_activity", "pm_list_activity",
]

[[mcp_servers]]
hosted = "memory"
why = "Keep meeting decisions and commitments across sessions"

[[mcp_servers]]
hosted = "doc"
why = "PRDs, plans, reports and meeting notes go into the shared library, versioned and reviewable — not to local files"
# The PM owns the project document tree: it creates the directories, so it is
# also the only one that may rename or prune them. Documents it writes are
# moved into place with `doc_move` rather than overwritten blind.
tools = [
  "doc_list", "doc_read", "doc_stat", "doc_write", "doc_move",
  "doc_mkdir", "doc_list_requests", "doc_check_request",
]

[capabilities.project_setup]
description = "Bootstrap a project: record, document directory, README index, and the member roster"
skills = ["project-setup"]

[capabilities.task_dispatch]
description = "Assign work to an agent through the PM service: roster, start time, approval gate, and reading dispatch state"
skills = ["task-dispatch"]

[capabilities.requirements_analysis]
description = "Analyze and document project requirements into a structured PRD"
skills = ["requirements-analysis"]

[capabilities.task_decomposition]
description = "Break down project goals into actionable tasks with estimates and dependencies"
skills = ["task-decomposition"]

[capabilities.risk_assessment]
description = "Identify, evaluate, and create mitigation plans for project risks"
skills = ["risk-assessment"]
