# Software Architect Agent
# A principal-level architect for system design, architecture review, technical planning, and risk assessment.

agent_id = "com.acowork.software-architect"
version = "1.1.9"
name = "Architect"
role = "Software Architect"
description = "A principal-level software architect skilled in requirements analysis, system design, architecture review, module boundaries, interface contracts, scalability, security, and technical planning."
author = "ACowork Team"
runtime_version = "0.1.0"
dev = false
labels = ["architecture", "design"]
avatar = "assets/avatar.jpg"

identity_deps = ["language", "timezone"]

[[permissions]]
type = "FilesystemRead"

[[permissions]]
type = "FilesystemWrite"

[[permissions]]
type = "Network"

[[permissions]]
type = "Shell"

# Tool opt-in declarations.
# Software Architect investigates systems, reviews designs, and plans technical
# work — the broadest tool set among user agents, mirroring the senior engineer's
# shell + LSP needs for architecture review and infrastructure investigation:
#   - file_read/file_edit/doc_reader → navigate and author designs
#   - bash/powershell/shell          → investigate infra, run analysis tools
#   - http_request/web_fetch         → research patterns & best practices
#   - codebase                       → LSP-based code intelligence for review
#   - memory                         → architecture decisions and trade-offs
#   - intent_send                    → coordinate with dev and review agents
#   - ask_user_question/todo_write   → clarify requirements & track planning
# Shell tools are declared for all three names (platform-detected) so an
# architect always has shell access on every platform.

# --- Filesystem ---
# `file_read` is declared because `system-design-review` and `technical-planning`
# inspect repository sources. `file_write` is NOT declared: every Architect
# deliverable is a document and goes out through `doc_write`.
[[tools]]
name = "file_read"

[[tools]]
name = "file_edit"

[[tools]]
name = "image_read"

[[tools]]
name = "doc_reader"

# --- Network ---
[[tools]]
name = "http_request"

[[tools]]
name = "web_fetch"

# --- Shell (platform-detected; declare all three for cross-platform opt-in) ---
[[tools]]
name = "bash"

[[tools]]
name = "powershell"

[[tools]]
name = "shell"

# --- Inter-agent ---
[[tools]]
name = "intent_send"

# --- Workflow ---
[[tools]]
name = "ask_user_question"

[[tools]]
name = "todo_write"

# --- Advanced ---
[[tools]]
name = "load_skill"

[llm]
temperature = 0.25
max_tokens = 32768
context_window = 200000

[llm.routing]
strategy = "quality_priority"
fallback_order = ["claude", "openai"]

[llm.budget]
max_output_tokens = 8192
exceeded_action = "warn"


# Behaviour defaults for agent_config.json. Seeded only into fields the user
# has not set; never overwrites a user value.
[config]
temperature = 0.4
context_window = 200000
max_output_tokens = 8192
max_iterations = 40

[memory]
enabled = true
retention_days = 365

[resources]
max_memory_mb = 512
idle_timeout_secs = 3600

[sandbox]
enabled = false

# Recommended MCP servers. A recommendation, not an installation — the user
# confirms install/activation in the Tools panel.

[[mcp_servers]]
hosted = "memory"
why = "Retain ADRs, trade-off analyses and review outcomes over time"

[[mcp_servers]]
hosted = "pm"
why = "Claim, work and submit project tasks — the participation surface, not the management one"
# The task tools this agent needs to take part in a project: see the queue it
# was given, read the task and its acceptance criteria, claim it, report
# progress and blockers, and submit the result. The management-plane tools
# (creating projects, changing tasks, managing the roster) stay with the PM
# agent, so the boundary is enforced by the declaration itself rather than by
# prose the model might ignore.
tools = [
  "pm_list_tasks", "pm_get_task", "pm_get_project", "pm_claim_task",
  "pm_submit_task", "pm_add_activity", "pm_list_activity",
]

[[mcp_servers]]
hosted = "doc"
why = "Deliverables go into the shared project document tree instead of local files"
# The same reasoning as `pm` above: this agent reads and writes the shared
# document tree, and moves a finished document to its final name. Deleting is
# left out because removal is the owner's decision, and creating directories
# is left out because the project tree has one owner — the PM agent builds it
# once, so a participant never ends up in charge of a directory it created.
tools = [
  "doc_list", "doc_search", "doc_read", "doc_stat", "doc_write", "doc_move",
  "doc_list_requests", "doc_check_request",
]

[[mcp_servers]]
preset = "context7"
why = "Verify framework capabilities and version constraints before designing"

[capabilities.architecture_strategy]
description = "Create architecture strategies with explicit trade-offs, decision records, and migration paths"
skills = ["architecture-strategy"]

[capabilities.system_design_review]
description = "Review system designs for boundaries, coupling, scalability, reliability, security, and operability"
skills = ["system-design-review"]

[capabilities.technical_planning]
description = "Convert approved designs into implementation plans with clear module ownership, interfaces, tests, and rollout steps"
skills = ["technical-planning"]

[capabilities.architecture_risk_assessment]
description = "Assess architectural risks, blast radius, reversibility, rollback paths, and operational failure modes"
skills = ["architecture-risk-assessment"]

# The participation capability is listed last because it is the one every other
# capability in this package runs inside: a project task is claimed, its
# deliverable published to the project document tree, and its result
# submitted through the task service. Declaring it is what makes the
# participation skill ship-checked at packaging time and what makes it show in
# the capability panel.
[capabilities.project_participation]
description = "Claim, publish and submit work in a project: accept a dispatched task, publish its deliverable to the project document tree, record blockers and handoffs as activity, and submit the result"
skills = ["project-participation"]
