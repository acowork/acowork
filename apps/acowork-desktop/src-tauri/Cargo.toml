[package]
name = "acowork-desktop"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "=2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "process"] }
thiserror = "2"
anyhow = "1"
acowork-core = { path = "../../../core/acowork-core" }
# ADR-039 Phase 2: shared MQTT session lifecycle
acowork-mqtt-session = { path = "../../../core/acowork-mqtt-session" }
async-trait = "0.1"
directories = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "local-time"] }
# Local interface enumeration for the frontend connectivity guard
# (src/lib/connectivity/localNetwork.ts).
if-addrs = "0.15"
zip = { version = "2", default-features = false, features = ["deflate"] }
toml = "0.8"
# Agent Hub package integrity check (hub_client::verify_sha256). Same version
# as the core workspace's `sha2` so both sides of the IPC boundary agree.
sha2 = "0.10"

# MQTT (ADR-033 Phase 3): Desktop MQTT client for real-time events
# `default-features = false`: rumqttc's default `use-rustls` enables the
# rustls `aws-lc-rs` provider, colliding with the workspace-wide `ring`
# unification (design doc 24 M4 review, C1). The TLS provider is
# guaranteed by acowork-mqtt-session (`ensure_crypto_provider`).
rumqttc = { version = "0.25", default-features = false }
# Relay remote mode: decode the `sub` claim out of the mirrored access
# token (base64url JWT payload segment) for the MQTT client_id.
base64 = "0.22"
# Required for MQTT payload protobuf encoding
prost = "0.13"

# OS clipboard — used by `get_clipboard_file_paths` to read CF_HDROP
# (Windows), NSFilenamesPboardType (macOS), and text/uri-list (Linux) so
# the chat panel can upload files that the user copied from the OS file
# manager.  WebView2 doesn't expose real filesystem paths in the DOM
# ClipboardEvent when files are copied, so we read the native clipboard
# ourselves.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Ole", "Win32_UI_Shell"] }

[target.'cfg(target_os = "macos")'.dependencies]
# objc2 (not objc 0.2): objc 0.2's sel!/msg_send! macros reference the
# non-exported `sel_impl` macro and fail to expand under edition 2024's
# stricter macro hygiene. objc2's proc macros are edition-2024-safe.
# `exception` feature enables `objc2::exception::catch`, which wraps
# @try/@catch around every msg_send! and turns NSException into a Rust
# Result — this is REQUIRED for the pasteboard read path, because
# NSPasteboard / NSString can raise NSException on stale items, mixed-
# type pasteboards, or after a long uptime, and an NSException that
# unwinds across a Rust `catch_unwind` boundary triggers
# `__rust_foreign_exception` → `abort()`.
objc2 = { version = "0.6", features = ["exception"] }
# block2: stack-allocated Objective-C blocks for
# `NSNotificationCenter.addObserverForName:object:queue:usingBlock:`.
# The block is invoked on the thread Foundation picks for the
# notification (typically main thread for NSWorkspace), and only
# `copy()`-retained blocks survive the observer registration; this
# matches the block2 idiom of `StackBlock::new(...).copy()`.
# Version already pinned in Cargo.lock by Tauri's transitive
# dependencies (tauri → tao → block2), so declaring it directly does
# not change the resolution. We do NOT depend on the high-level
# `objc2-app-kit` / `objc2-foundation` safe wrappers here — the
# observer path is a small handful of `msg_send!` calls (`NSWorkspace`,
# `notificationCenter`, `NSString stringWithUTF8String:`,
# `addObserverForName:…`), all of which are already available
# through objc2's runtime macros, and pulling in the high-level
# crates would force a wide feature matrix we do not need.
block2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
# zbus: subscribe to systemd-logind's `PrepareForSleep(b)` signal on
# the system bus. The false edge of that signal is the OS-broadcast
# "system just woke from sleep" event that we feed into
# `wake_recovery::signal_display_ready()`. Using zbus 5 (already pinned
# by tauri) keeps the resolver happy without bumping the lockfile.
zbus = { version = "5", default-features = false, features = ["tokio"] }
# tokio-stream: `MessageStream::for_match_rule` returns a futures
# `Stream`; tokio-stream re-exports `StreamExt` with a stable
# signature across zbus / tokio upgrades, and its `next()` is the
# smallest surface that does not pull in all of `futures-util`.
tokio-stream = { version = "0.1", features = ["sync"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
